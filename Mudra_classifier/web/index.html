<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudra Recognizer</title>
<style>
  :root { --bg:#faf7f2; --fg:#1f1b16; --muted:#6b6258; --card:#fff; --line:#e6dfd5; --accent:#b4441f; --ok:#2f7d4a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16130f; --fg:#f2ece4; --muted:#a39888; --card:#211d18; --line:#352f28; --accent:#ec8a5f; --ok:#6cc48b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { margin:0 0 16px; color:var(--muted); }
  .grid { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:16px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .stage { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3; }
  video, canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; padding:24px; background:rgba(0,0,0,.55); }
  .overlay[hidden] { display:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .big { font-size:2rem; font-weight:700; min-height:2.6rem; }
  .big.ok { color:var(--ok); } .big.wait { color:var(--muted); font-size:1.3rem; }
  .row { display:flex; justify-content:space-between; font-size:.92rem; margin-top:10px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:3px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  button, select { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  label { font-size:.9rem; color:var(--muted); }
  .who { font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-top:14px; }
  .who:first-child { margin-top:0; }
  .stat { font-size:.85rem; color:var(--muted); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>Mudra Recognizer</h1>
  <p class="sub">Runs entirely in your browser. Nothing from the camera leaves your device.</p>
  <div class="grid">
    <div>
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="canvas"></canvas>
        <div class="overlay" id="overlay">Click "Start camera" and allow camera access.</div>
      </div>
      <div class="controls">
        <button class="primary" id="start">Start camera</button>
        <select id="mode" title="Which mudras to look for">
          <option value="auto">All mudras</option>
          <option value="single">Single-hand mudras only</option>
          <option value="double">Two-hand mudras only</option>
        </select>
        <select id="cams" hidden></select>
        <label>Min confidence <input type="range" id="thr" min="30" max="95" value="60"> <span id="thrv">60%</span></label>
      </div>
    </div>
    <div class="card">
      <div id="results"><div class="big wait">Waiting for camera</div></div>
      <div class="stat" id="stat"></div>
    </div>
  </div>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
